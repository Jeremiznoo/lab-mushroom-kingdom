---
# Gabarit. Copier en credentials.yml puis chiffrer :
#   cp credentials.example.yml credentials.yml
#   ansible-vault encrypt credentials.yml
# credentials.yml est listé dans .gitignore : ne JAMAIS le committer en clair.

# IP DHCP actuelle de l'interface DMZ de TOAD (change à chaque reboot/reset).
toad_dmz_ip: "203.0.113.42"

# Compte système dédié au partage Samba interne (transfert d'outils).
toad_samba_user: "transferbot"
toad_samba_password: "CHANGE_ME_sambapass"

# Compte système toadette sur TOAD, trouvé en craquant le coffre KeePass
# volontairement faible déposé dans /var/backups (privesc voulue, voir rôle
# toad). Doit être identique au mot de passe stocké dans l'entrée du coffre.
toadette_password: "CHANGE_ME_toadettepass"

# Compte de service AD utilisé par le pool applicatif IIS sur KOOPALINGS-CASTLE.
# Déposé en clair dans /root/castle_access.txt par le rôle toad (voir README
# pour le risque de contournement associé si WinRM n'est pas verrouillé).
svc_bowser_jr_user: "svc_bowser_jr"
svc_bowser_jr_password: "CHANGE_ME_svcpass"
koopalings_svc_account_password: "CHANGE_ME_svcpass" # doit être identique à svc_bowser_jr_password

# Compte d'administration local/domaine utilisé UNIQUEMENT par Ansible
# (WinRM) pour gérer KOOPALINGS-CASTLE. Jamais utilisé par l'attaquant.
koopalings_admin_user: "MUSHROOMKINGDOM\\lab-ops"
koopalings_admin_password: "CHANGE_ME_opspass"

# Compte d'administration de domaine utilisé UNIQUEMENT par Ansible (WinRM)
# pour le bootstrap de DC-BOWSER-KINGDOM (distinct du compte "planté" ci-dessous).
bowser_admin_bootstrap_user: "MUSHROOMKINGDOM\\lab-ops"
bowser_admin_bootstrap_password: "CHANGE_ME_opspass"

# Compte Domain Admin équivalent volontairement planté (découverte prévue
# via dump LSASS / credentials en cache sur KOOPALINGS-CASTLE).
bowser_admin_password: "CHANGE_ME_bowseradminpass"
