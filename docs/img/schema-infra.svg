<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 500" font-family="Arial, Helvetica, sans-serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b93432"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="980" height="500" fill="#fdfaf5"/>

  <text x="490" y="26" text-anchor="middle" font-size="20" font-weight="bold" fill="#2a1718">Mushroom Kingdom : schema d'infrastructure</text>

  <!-- Attaquant -->
  <g>
    <rect x="20" y="210" width="140" height="80" rx="12" fill="#2a1718"/>
    <text x="90" y="256" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">Attaquant</text>
  </g>

  <!-- DMZ box -->
  <rect x="210" y="130" width="280" height="260" rx="10" fill="none" stroke="#b93432" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="350" y="118" text-anchor="middle" font-size="13" fill="#b93432" font-weight="bold">DMZ : 10.201.220.0/24</text>

  <!-- TOAD -->
  <g>
    <rect x="240" y="230" width="220" height="80" rx="12" fill="#b93432"/>
    <text x="350" y="265" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">TOAD-MUSHROOM</text>
    <text x="350" y="285" text-anchor="middle" font-size="11" fill="#ffe3d6">10.201.220.199 · 10.10.20.1</text>
  </g>

  <!-- Internal network box -->
  <rect x="540" y="70" width="420" height="390" rx="10" fill="none" stroke="#38191d" stroke-width="2" stroke-dasharray="6,5"/>
  <text x="750" y="58" text-anchor="middle" font-size="13" fill="#38191d" font-weight="bold">Reseau interne : 10.10.20.0/24</text>

  <!-- KOOPALINGS -->
  <g>
    <rect x="570" y="110" width="220" height="80" rx="12" fill="#38191d"/>
    <text x="680" y="145" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">KOOPALINGS-CASTLE</text>
    <text x="680" y="165" text-anchor="middle" font-size="11" fill="#e8d5c3">10.10.20.20</text>
  </g>

  <!-- DC BOWSER -->
  <g>
    <rect x="680" y="330" width="240" height="80" rx="12" fill="#38191d"/>
    <text x="800" y="365" text-anchor="middle" font-size="14" fill="#fff" font-weight="bold">DC-BOWSER-KINGDOM</text>
    <text x="800" y="385" text-anchor="middle" font-size="11" fill="#e8d5c3">10.10.20.30</text>
  </g>

  <!-- Fleche 1 : attaquant -> toad -->
  <line x1="162" y1="270" x2="238" y2="270" stroke="#b93432" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="162" y1="270" x2="238" y2="270" stroke="#ffc84b" stroke-width="3" stroke-dasharray="6,10" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Fleche 2 : toad -> koopalings (pivot) -->
  <line x1="462" y1="250" x2="568" y2="170" stroke="#b93432" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="462" y1="250" x2="568" y2="170" stroke="#ffc84b" stroke-width="3" stroke-dasharray="6,10" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Fleche 3 : koopalings -> dc bowser -->
  <line x1="700" y1="192" x2="760" y2="328" stroke="#b93432" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="700" y1="192" x2="760" y2="328" stroke="#ffc84b" stroke-width="3" stroke-dasharray="6,10" marker-end="url(#arrow)">
    <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/>
  </line>

  <!-- Legende -->
  <g font-size="10" fill="#80666a">
    <rect x="20" y="450" width="12" height="12" fill="#b93432"/>
    <text x="38" y="460">Machine compromise</text>
    <line x1="160" y1="456" x2="195" y2="456" stroke="#ffc84b" stroke-width="3" stroke-dasharray="6,10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1s" repeatCount="indefinite"/>
    </line>
    <text x="205" y="460">Chemin d'attaque</text>
  </g>

</svg>
